appId: de.ontrack.desktop
productName: OnTrack
copyright: © 2026 Bezi

directories:
  output: release
  buildResources: build

# Nur der Electron-Rahmen kommt ins asar-Archiv. Der eigentliche Next.js-Server
# liegt daneben unter resources/ — als Kindprozess gestartet könnte er aus
# einem asar-Archiv heraus weder seine native Prisma-Engine laden noch Dateien
# nachladen.
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"
  # Der Hauptprozess braucht electron-updater samt Abhaengigkeiten IM Paket.
  # Ohne diese Zeilen meldet das Selbstupdate im installierten Programm
  # "Modul nicht gefunden" — im Quelltext laeuft es, der Fehler existiert nur
  # im Artefakt. tests/packaging.test.ts haelt die Liste vollstaendig.
  - node_modules/argparse/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/debug/**/*
  - node_modules/electron-updater/**/*
  - node_modules/fs-extra/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/js-yaml/**/*
  - node_modules/jsonfile/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/ms/**/*
  - node_modules/sax/**/*
  - node_modules/semver/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/universalify/**/*

# Wo die App nach neuen Fassungen sieht. electron-builder schreibt daraus
# resources/app-update.yml ins Paket und erzeugt beim Bauen die Feed-Dateien
# latest.yml / latest-mac.yml / latest-linux.yml.
publish:
  provider: github
  owner: thecrafti87
  repo: ontrack
  # Entwuerfe sieht weder die App noch die API — der Feed bliebe leer.
  releaseType: release

asar: true
afterPack: build/after-pack.js

mac:
  category: public.app-category.business
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Ohne Apple-Developer-Zertifikat wird nicht notarisiert; after-pack.js
  # setzt stattdessen eine Ad-hoc-Signatur, sonst startet die App auf
  # Apple Silicon gar nicht.
  identity: null
  extendInfo:
    NSCameraUsageDescription: OnTrack benötigt die Kamera zum Scannen von QR-Codes auf Geräteetiketten.
    NSLocationWhenInUseUsageDescription: OnTrack speichert auf Wunsch den Standort eines Scans, damit Geräte wiedergefunden werden können.

dmg:
  title: OnTrack ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: OnTrack

linux:
  icon: build/icon.png
  category: Office
  synopsis: Inventar- und Einsatz-Tracking für Veranstaltungstechnik
  desktop:
    entry:
      Name: OnTrack
      Comment: Inventar- und Einsatz-Tracking für Veranstaltungstechnik
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
