name: Prüfen

# Läuft bei jedem Push und jedem Pull Request auf main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruefen:
    name: Lint, Typen, Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # Erzeugt den Prisma-Client — ohne ihn scheitern Typprüfung und die
      # Integrationstests, die gegen eine echte SQLite-Datei laufen.
      - name: Prisma-Client erzeugen
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typen prüfen
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
